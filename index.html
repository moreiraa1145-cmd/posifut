<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PosiFut</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="contenedor">

        <h1>⚽ PosiFut</h1>

        <p class="descripcion">
            Descubre qué posición de fútbol se adapta mejor a tu estilo de juego.
        </p>

        <h2>¿Cuál de estas características te representa más?</h2>

        <select id="caracteristica">
            <option value="">Selecciona una opción</option>
            <option value="rapido">Soy rápido</option>
            <option value="pase">Tengo buen pase</option>
            <option value="defensa">Defiendo bien</option>
            <option value="goles">Me gusta marcar goles</option>
        </select>

        <button id="boton">Ver mi posición</button>

        <div id="resultado">
            <h2 id="posicion"></h2>
            <p id="explicacion"></p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
